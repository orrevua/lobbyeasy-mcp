services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p4_lobby
    ports: ["5432:5432"]
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/mcp.sql:/docker-entrypoint-initdb.d/02-mcp.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d p4_lobby"]
      interval: 2s
      retries: 20

  mcp:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOBBY_BACKEND: postgres
      LOBBY_KEY_STORE: postgres
      LOBBY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/p4_lobby
      LOBBY_PUBLIC_URL: http://localhost:8080
    ports: ["8080:8080"]
