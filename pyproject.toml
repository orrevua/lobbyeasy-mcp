[project]
name = "lobbyeasy-mcp"
version = "0.1.0"
description = "Model Context Protocol server for LobbyEasy, a building lobby package manager"
readme = "README.md"
authors = [
    { name = "orrevua", email = "felipevictor67@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.scripts]
lobbyeasy-mcp = "lobbyeasy_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: also runs against a real Postgres (skipped when unreachable)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # the formatter wraps code; long SQL/markdown literals stay readable
