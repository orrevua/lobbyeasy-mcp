name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p4_lobby
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d p4_lobby"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      LOBBY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p4_lobby
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      - run: uv build
