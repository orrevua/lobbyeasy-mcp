# On a version tag: publish to PyPI (trusted publishing) and push the image to GHCR.
# Configure the PyPI trusted publisher for orrevua/lobbyeasy-mcp first. Not exercised yet.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/orrevua/lobbyeasy-mcp:${{ github.ref_name }}
            ghcr.io/orrevua/lobbyeasy-mcp:latest
